name: Admin CI

on:
  workflow_dispatch:
  push:
    paths:
      - "admin/**"
    branches: [ main ]
  pull_request:
    paths:
      - "admin/**"
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11
    - name: Set up Node 24
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'pnpm'
        cache-dependency-path: admin/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Run format-check
      run: pnpm run format-check
    - name: Run type-check
      run: pnpm run type-check
    - name: Run lint-check
      run: pnpm run lint-check
    - name: Run tests
      run: pnpm run test
    - name: Run prod test-build
      run: pnpm run build
